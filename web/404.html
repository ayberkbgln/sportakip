<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan — sayfa bulunamadı</title>
<meta name="theme-color" content="#0A0B0D">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- GitHub Pages bilinmeyen yollarda bu dosyayı servis eder. Kendi kendine
     yeten bir sayfa: stil.css'e bağlı değil. -->
<style>
:root{--zemin:#0A0B0D;--metin:#EDEDE8;--soluk:#828B99;--vurgu:#D2FF3E;--cizgi:#262B34;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono",Menlo,monospace;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--zemin);}
body{color:var(--metin);font-family:var(--sans);display:flex;align-items:center;
  justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased;}
.kod{font-family:var(--mono);font-size:64px;font-weight:800;letter-spacing:-.05em;
  color:var(--vurgu);line-height:1;margin:0 0 14px;}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px;}
p{color:var(--soluk);font-size:14px;line-height:1.6;margin:0 0 26px;max-width:340px;}
a{display:inline-block;background:var(--vurgu);color:#1A2205;text-decoration:none;
  font-weight:700;font-size:15px;padding:13px 26px;border-radius:14px;}
.alt{margin-top:22px;font-family:var(--mono);font-size:11px;color:#5C6470;}
.alt a{background:none;color:#5C6470;padding:0;font-weight:400;text-decoration:underline;}
</style>
</head>
<body>
<div>
  <p class="kod">404</p>
  <h1>Bu sayfa yok</h1>
  <p>Aradığın adres taşınmış ya da hiç var olmamış olabilir.</p>
  <a href="./index.html">Uygulamaya git</a>
  <p class="alt"><a href="./gizlilik.html">Gizlilik politikası</a></p>
</div>
</body>
</html>
